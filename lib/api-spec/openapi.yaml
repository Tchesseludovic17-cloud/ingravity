openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: actions
    description: Contrôle des actions proposées par des agents IA
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /check-action:
    post:
      operationId: checkAction
      tags: [actions]
      summary: Évalue une action proposée
      description: Applique les règles configurées, calcule un score de risque et enregistre la décision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckActionRequest"
      responses:
        "200":
          description: Décision prise pour l’action
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: string
                    enum: [approved, blocked, pending_approval]
                  reason:
                    type: string
                  risk_score:
                    type: integer
                    minimum: 0
                    maximum: 100
                required:
                  - decision
                  - reason
                  - risk_score
        "400":
          description: Corps de requête invalide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CheckActionRequest:
      type: object
      properties:
        action_type:
          type: string
          minLength: 1
          example: payment
        amount:
          type: number
          minimum: 0
          example: 1250
        metadata:
          type: object
          additionalProperties: true
          example:
            order_id: order-123
      required:
        - action_type
        - metadata
    ValidationError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

